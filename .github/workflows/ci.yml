name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumina" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, format
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: curl -fsS localhost:3000/api/health && curl -fsS localhost:3000/api/users
      - name: Test suite in the test container
        run: docker compose --profile test run --rm test
      - if: failure()
        run: docker compose logs
